name: Daily AI Blog Generator

on:
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 PM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install jsdom
        working-directory: ./scripts

      - name: Generate Blog Post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node scripts/generate_blog.js

      - name: Commit and Push new blog post
        run: |
          git config --global user.name "Vayra Bot"
          git config --global user.email "bot@vayra.team"
          git add public/blog/ public/sitemap.xml
          git commit -m "Auto-generated daily blog post [skip ci]" || echo "No changes to commit"
          git push

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN"
